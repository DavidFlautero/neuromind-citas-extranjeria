name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository hygiene
        run: |
          test -f README.md
          test -f .gitignore
          ! git ls-files | grep -E '(^|/)\.env$|storage-state.*\.json$'
